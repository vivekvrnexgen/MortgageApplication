name: DBB Build

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    labels: [ "zdt", "dbb" ]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run DBB user build
        run: |
          ${{ secrets.DBB_HOME }}/bin/groovyz \
            ${{ secrets.ZAPPBUILD_DIR }}/build.groovy \
            --sourceDir ${{ secrets.SOURCEDIR }} \
            --workDir   ${{ secrets.WORKDIR }} \
            --hlq       ${{ secrets.HLQ }} \
            --application ${{ secrets.APPLICATION }} \
            --verbose \
            --userBuild 'MortgageApplication/cobol/epsmpmt.cbl'

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbb-reports
          path: ${{ secrets.WORKDIR }}/reports
